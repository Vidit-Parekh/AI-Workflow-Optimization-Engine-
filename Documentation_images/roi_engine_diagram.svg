<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">ROI Engine — From Classification to Business Value</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6c757d">Translates AI opportunity labels into financial metrics a CFO would recognise</text>

  <!-- ── ROW 1: Two inputs side by side ── -->

  <!-- Input A: ClassificationResult -->
  <rect x="60" y="70" width="360" height="64" rx="8" fill="#EDE7F6" stroke="#7E57C2" stroke-width="1.5"/>
  <text x="240" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#4527A0">ClassificationResult objects</text>
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="#7E57C2">task_id · label · confidence · tool_suggestion</text>

  <!-- Input B: ROIConfig -->
  <rect x="480" y="70" width="360" height="64" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="660" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#BF360C">ROIConfig (tunable)</text>
  <text x="660" y="111" text-anchor="middle" font-size="11" fill="#E65100">hourly_rate · implementation_cost</text>
  <text x="660" y="127" text-anchor="middle" font-size="11" fill="#E65100">saving_factors: auto=80% · aug=40% · non_ai=0%</text>

  <!-- Arrows from both inputs down to compute() -->
  <line x1="240" y1="134" x2="340" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="134" x2="560" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 2: compute() central box ── -->
  <rect x="240" y="180" width="420" height="44" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="2"/>
  <text x="450" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1A237E">ROIEngine.compute(results, frequencies, durations)</text>
  <text x="450" y="216" text-anchor="middle" font-size="10" fill="#3F51B5">Loops over each task · applies formulas · builds TaskROI list</text>

  <!-- Arrow down to 3 formula boxes -->
  <line x1="320" y1="224" x2="175" y2="268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="224" x2="450" y2="268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="224" x2="725" y2="268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 3: Three formula boxes ── -->

  <!-- Formula 1: Time Saved -->
  <rect x="40" y="268" width="270" height="100" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="175" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#E65100">Time Saved / Year</text>
  <rect x="60" y="302" width="230" height="22" rx="5" fill="#F9A825"/>
  <text x="175" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="white">freq × duration × saving_factor</text>
  <text x="175" y="342" text-anchor="middle" font-size="11" fill="#BF360C">auto: 80% · aug: 40% · non_ai: 0%</text>
  <text x="175" y="358" text-anchor="middle" font-size="10" fill="#F9A825">→ hours/year freed by AI</text>

  <!-- Formula 2: Cost Saved -->
  <rect x="315" y="268" width="270" height="100" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="450" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1B5E20">Cost Saved / Year</text>
  <rect x="335" y="302" width="230" height="22" rx="5" fill="#2E7D32"/>
  <text x="450" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="white">time_saved_hrs × hourly_rate_usd</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#2E7D32">e.g. 1,000 hrs × $55 = $55,000</text>
  <text x="450" y="358" text-anchor="middle" font-size="10" fill="#388E3C">→ USD saved per task per year</text>

  <!-- Formula 3: ROI Score -->
  <rect x="590" y="268" width="270" height="100" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="725" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#0D47A1">ROI Score (0–100)</text>
  <rect x="610" y="302" width="230" height="22" rx="5" fill="#1565C0"/>
  <text x="725" y="317" text-anchor="middle" font-size="11" font-weight="600" fill="white">50% cost + 30% conf + 20% accuracy</text>
  <text x="725" y="342" text-anchor="middle" font-size="11" fill="#1565C0">log-scaled · prevents outlier dominance</text>
  <text x="725" y="358" text-anchor="middle" font-size="10" fill="#1976D2">→ composite priority ranking</text>

  <!-- Arrows from 3 boxes down to what-if -->
  <line x1="175" y1="368" x2="310" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="368" x2="450" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="725" y1="368" x2="590" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── ROW 4: What-if simulation ── -->
  <rect x="40" y="408" width="820" height="68" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="450" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#4A148C">What-If Simulation — 5 Adoption Scenarios</text>

  <!-- Scenario pills -->
  <rect x="60"  y="440" width="110" height="20" rx="6" fill="#CE93D8"/>
  <text x="115" y="454" text-anchor="middle" font-size="10" fill="#4A148C">0% · $0 saved</text>

  <rect x="185" y="440" width="130" height="20" rx="6" fill="#BA68C8"/>
  <text x="250" y="454" text-anchor="middle" font-size="10" fill="white">25% · top 2 tasks</text>

  <rect x="330" y="440" width="140" height="20" rx="6" fill="#AB47BC"/>
  <text x="400" y="454" text-anchor="middle" font-size="10" fill="white">50% · top 4 tasks</text>

  <rect x="485" y="440" width="140" height="20" rx="6" fill="#8E24AA"/>
  <text x="555" y="454" text-anchor="middle" font-size="10" fill="white">75% · top 7 tasks</text>

  <rect x="640" y="440" width="140" height="20" rx="6" fill="#6A1B9A"/>
  <text x="710" y="454" text-anchor="middle" font-size="10" fill="white">100% · all tasks</text>

  <text x="450" y="470" text-anchor="middle" font-size="10" fill="#9C27B0">Each scenario shows: annual saving · hours freed · payback months</text>

  <!-- ── ROW 5: BPI 2019 result bar ── -->
  <rect x="40" y="494" width="820" height="48" rx="8" fill="#1B5E20"/>
  <text x="450" y="516" text-anchor="middle" font-size="13" font-weight="700" fill="white">BPI 2019 Full Dataset Result</text>
  <text x="450" y="534" text-anchor="middle" font-size="12" fill="#A5D6A7">$8.7M annual saving  ·  193,000 hrs freed  ·  0.1 month payback  ·  42 tasks · 1.59M events</text>

</svg>
